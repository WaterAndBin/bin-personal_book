syntax = "proto3";

package api.tags.v1;

import "google/api/annotations.proto";

option go_package = "bin-personal-book/api/tags/v1;v1";

service Greeter {
  rpc UpdateBillTags(UpdateBillTagsParams) returns (UpdateBillTagsResult) {
    option (google.api.http) = {
      post : "/updateBillTags",
      body : "*"
    };
  }
}

message UpdateBillTagsParams {
  string tag_id = 1;
  string tag_name = 2;
  string tag_icon = 3;
}

message UpdateBillTagsResult {}