syntax = "proto3";

package api.upload.v1;

import "google/api/annotations.proto";

option go_package = "bin-personal-book/api/upload/v1;v1";

service Greeter {
  // 登录
  rpc Upload(UploadParams) returns (UploadResult) {
    option (google.api.http) = {
      post : "/upload",
      body : "*"
    };
  }

}

message UploadParams {}

message UploadResult {
    string url = 1;
}